name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Version
        id: semantic
        uses: go-semantic-release/action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout release tag
        if: steps.semantic.outputs.version != ''
        uses: actions/checkout@v4
        with:
          ref: v${{ steps.semantic.outputs.version }}
          fetch-depth: 0

      - name: Set up Go
        if: steps.semantic.outputs.version != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        if: steps.semantic.outputs.version != ''
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build UI
        if: steps.semantic.outputs.version != ''
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund 2>/devnull || npm install --no-audit --no-fund
          npm run build

      - name: Build binaries
        if: steps.semantic.outputs.version != ''
        run: |
          go mod tidy
          VERSION="${{ steps.semantic.outputs.version }}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X main.Version=${VERSION}" \
            -o aptuary-amd64 ./cmd/aptuary
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -ldflags="-s -w -X main.Version=${VERSION}" \
            -o aptuary-arm64 ./cmd/aptuary

      - name: Upload release assets
        if: steps.semantic.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.semantic.outputs.version }}
          name: v${{ steps.semantic.outputs.version }}
          files: |
            aptuary-amd64
            aptuary-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}